<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal PDPR</title>
  <meta name="description" content="Portal Pembelajaran Di Rumah — jadual dan bahan pembelajaran setiap kelas.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f5c4d">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="PDPR CBA4082">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <section class="wira">
    <div class="kad sapa">
      <h1>Pembelajaran Di Rumah</h1>
      <p>Cari kelas anak anda untuk melihat jadual, lembaran kerja dan bahan daripada guru.</p>
      <div class="butang-baris">
        <a class="btn" href="kelas.html">Lihat Jadual Kelas</a>
        <a class="btn kedua" href="login.html">Log Masuk Guru</a>
      </div>
      <button class="btn-pasang" data-pasang hidden>📲 Pasang aplikasi di telefon</button>
    </div>
    <div class="kad status-hari">
      <div class="nav-hari pilih-tarikh">
        <button class="btn kedua kecil" id="sebelum" aria-label="Hari sebelum">‹</button>
        <input type="date" id="tarikh" aria-label="Pilih tarikh">
        <button class="btn kedua kecil" id="selepas" aria-label="Hari selepas">›</button>
        <button class="btn kedua kecil" id="kini" hidden>Hari ini</button>
      </div>
      <div id="status"><span class="lembut">Memuatkan status…</span></div>
    </div>
  </section>

  <div class="cari-kelas" id="kotak-cari">
    <div class="kotak"><span class="ik-cari" id="ik-cari"></span>
      <input type="search" id="cari" placeholder="Cari kelas… cth: raub, 4, pra" autocomplete="off" enterkeyhint="go" aria-label="Cari kelas"></div>
    <div class="terakhir" id="terakhir" hidden></div>
  </div>

  <div id="senarai"><p class="memuat">Memuatkan senarai kelas…</p></div>
</main>

<script type="module">
  import { pasangRangka, pasangButangPasang, hariIni, hariBekerja, tambahHari, formatTarikh, esc } from './assets/js/ui.js';
  import { muatJadual, statusPdpr, kelasTerlibat, bahanTarikh } from './assets/js/data.js';
  import { indeksHari, sesiHari } from './assets/js/jadual.js';
  import { padanKelas, susunKelas, kelasTerakhir, ikonCari } from './assets/js/cari-kelas.js';

  pasangRangka('index.html');
  pasangButangPasang();

  const $ = (id) => document.getElementById(id);
  const kini = hariIni();
  const elStatus = $('status'), elSenarai = $('senarai'), elTarikh = $('tarikh'), elCari = $('cari');
  $('ik-cari').innerHTML = ikonCari;
  let jadualSemasa = null;

  // Tapis kad kelas mengikut carian (tanpa memuat semula data)
  function tapis() {
    if (!jadualSemasa) return;
    const q = elCari.value;
    let ada = 0;
    elSenarai.querySelectorAll('.kelas-kad').forEach((a) => {
      const ok = padanKelas(q, jadualSemasa.kelas[a.dataset.id]);
      a.hidden = !ok; if (ok) ada++;
    });
    elSenarai.querySelectorAll('[data-kump]').forEach((g) => (g.hidden = !g.querySelector('.kelas-kad:not([hidden])')));
    let tiada = elSenarai.querySelector('.tiada-padanan');
    if (!ada) {
      if (!tiada) { tiada = document.createElement('p'); tiada.className = 'tiada-padanan'; elSenarai.append(tiada); }
      tiada.textContent = `Tiada kelas sepadan dengan "${q}".`;
    } else tiada?.remove();
  }
  elCari.oninput = tapis;
  elCari.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    const pertama = elSenarai.querySelector('.kelas-kad:not([hidden])');
    if (pertama) location.href = pertama.href;
  };
  const p = new URLSearchParams(location.search);
  // Lalai: hari ini (atau hari persekolahan seterusnya jika hujung minggu)
  elTarikh.value = /^\d{4}-\d{2}-\d{2}$/.test(p.get('t') || '') ? p.get('t') : hariBekerja(kini, 1);

  const labelHari = (t) => {
    if (t === kini) return 'Hari ini';
    if (t === tambahHari(kini, 1)) return 'Esok';
    if (t === tambahHari(kini, -1)) return 'Semalam';
    return t > kini ? 'Akan datang' : 'Tarikh lepas';
  };

  let giliran = 0;
  async function muat() {
    const t = elTarikh.value;
    if (!t) return;
    history.replaceState(null, '', t === hariBekerja(kini, 1) ? location.pathname : `?t=${t}`);
    $('kini').hidden = t === hariBekerja(kini, 1);
    const saya = ++giliran;
    elStatus.innerHTML = '<span class="lembut">Memuatkan…</span>';

    try {
      const h = indeksHari(t);
      const [jadual, status, bahan] = await Promise.all([muatJadual(t), statusPdpr(t), h >= 0 ? bahanTarikh(t) : []]);
      if (saya !== giliran) return;

      elStatus.innerHTML = `
        <span class="lembut">${labelHari(t)}</span>
        <span class="besar">${esc(formatTarikh(t))}</span>
        <span><i class="titik ${status.aktif ? 'on' : ''}"></i>${
          h < 0 ? '<b>Hujung minggu</b>'
          : status.aktif
            ? status.kelas === 'semua' ? '<b>PDPR</b> untuk semua kelas' : `<b>PDPR</b> untuk ${status.kelas.length} kelas`
            : '<b>Tiada PDPR</b> — sesi persekolahan biasa'
        }</span>
        ${status.catatan ? `<small class="lembut">${esc(status.catatan)}</small>` : ''}
        ${status.aktif && bahan.length ? `<small class="lembut">${bahan.length} bahan telah dimuat naik</small>` : ''}`;

      // Kira bahan per kelas
      const kiraBahan = {};
      bahan.forEach((b) => (b.kelasIds || []).forEach((k) => (kiraBahan[k] = (kiraBahan[k] || 0) + 1)));

      jadualSemasa = jadual;
      const semua = susunKelas(jadual.kelas);

      // Kelas terakhir dilihat di peranti ini
      const terakhir = kelasTerakhir().filter((id) => jadual.kelas[id]);
      $('terakhir').hidden = !terakhir.length;
      $('terakhir').innerHTML = terakhir.length ? `<span class="lembut">Terakhir dilihat:</span>` +
        terakhir.map((id) => `<a class="cip" href="kelas.html?k=${jadual.kelas[id].slug}&t=${t}">${esc(jadual.kelas[id].nama)}</a>`).join('') : '';
      const kumpulan = [
        ['Prasekolah', semua.filter(([, k]) => k.jenis === 'pra')],
        ['Tahun 1 – 6', semua.filter(([, k]) => k.jenis !== 'pra')],
      ].filter(([, s]) => s.length);

      elSenarai.innerHTML = kumpulan.map(([tajuk, senarai]) => `<div data-kump>
        <div class="seksyen-tajuk"><h2>${tajuk}</h2><span class="lembut">${senarai.length} kelas</span></div>
        <div class="grid-kelas">${senarai.map(([id, k]) => {
          const nSesi = h >= 0 ? sesiHari(jadual, h, { kelasId: id }).length : 0;
          const terlibat = kelasTerlibat(status, id);
          const n = kiraBahan[id] || 0;
          const ket = h < 0 ? 'hujung minggu' : `${nSesi} sesi · ${terlibat ? `${n} bahan` : 'tiada PDPR'}`;
          return `<a class="kelas-kad ${terlibat && n ? 'ada-bahan' : ''}" data-id="${id}" href="kelas.html?k=${k.slug}&t=${t}">
            <b>${esc(k.nama)}</b>
            <small>${ket}</small>
          </a>`;
        }).join('')}</div></div>`).join('');
      tapis();
    } catch (e) {
      console.error(e);
      elSenarai.innerHTML = `<div class="notis amaran">Gagal memuatkan data. Sila cuba muat semula halaman.</div>`;
    }
  }

  elTarikh.onchange = muat;
  $('sebelum').onclick = () => { elTarikh.value = hariBekerja(tambahHari(elTarikh.value, -1), -1); muat(); };
  $('selepas').onclick = () => { elTarikh.value = hariBekerja(tambahHari(elTarikh.value, 1), 1); muat(); };
  $('kini').onclick = () => { elTarikh.value = hariBekerja(kini, 1); muat(); };
  muat();
</script>
</body>
</html>
