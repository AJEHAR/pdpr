<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kerja Murid · Portal PDPR</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0f5c4d">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="PDPR CBA4082">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    // Papar ralat jika skrip halaman gagal (cth fail lama dalam cache), bukannya tersekat pada "Memuatkan…"
    (function () {
      var dah = false;
      function papar(msg) {
        if (dah) return; dah = true;
        var m = document.querySelector('main');
        if (!m || document.querySelector('.app-sisi, .sisi, nav.sidebar')) return;
        m.insertAdjacentHTML('afterbegin', '<div class="notis bahaya" style="margin-top:12px"><b>Halaman gagal dimuatkan.</b> Tekan <b>Ctrl + Shift + R</b> (atau tutup &amp; buka semula aplikasi). <button class="btn kecil" style="margin-left:8px" onclick="location.reload(true)">Muat semula</button><div class="kecil" style="margin-top:6px;opacity:.75">' + String(msg).replace(/[<>&]/g, '') + '</div></div>');
      }
      addEventListener('error', function (e) { if (e.message) papar(e.message); });
      addEventListener('unhandledrejection', function (e) { papar((e.reason && (e.reason.code || e.reason.message)) || e.reason); });
    })();
  </script>
</head>
<body>
<main>
  <div class="kepala">
    <div>
      <h1>Kerja Murid</h1>
      <p class="lembut">Kerja yang dihantar oleh murid / ibu bapa bagi setiap sesi.</p>
    </div>
    <div class="nav-hari" style="flex-wrap:wrap">
      <select id="kelas" hidden style="width:auto"></select>
      <button class="btn kedua kecil" id="sebelum" aria-label="Hari sebelum"></button>
      <input type="date" id="tarikh" style="width:auto">
      <button class="btn kedua kecil" id="selepas" aria-label="Hari selepas"></button>
    </div>
  </div>
  <div class="statistik" id="statistik"></div>
  <div id="isi"><p class="memuat">Memuatkan…</p></div>
</main>

<script type="module">
  import { kawal, adalahAdmin, guruDilihat } from '../assets/js/auth.js';
  import { pasangApp, pasangJalurLihat, namaCantik, esc, ikon, hariIni, hariBekerja, tambahHari, formatTarikh, toast, mesejRalat } from '../assets/js/ui.js';
  import { muatJadual, statusPdpr, kelasTerlibat, hantaranJulat, muatTetapan, buang } from '../assets/js/data.js';
  import { sesiHari, indeksHari, labelWaktu } from '../assets/js/jadual.js';
  import { bukaKerjaMurid, buangFail } from '../assets/js/upload.js';

  const sesiAuth = await kawal('guru');
  await pasangApp('guru/kerja.html', sesiAuth);
  const { profil } = sesiAuth;
  const LIHAT = guruDilihat(profil);          // Pantau Guru (admin, lihat sahaja)
  const GID = LIHAT || profil.guruId;

  const $ = (id) => document.getElementById(id);
  $('sebelum').innerHTML = ikon('kiri', 18);
  $('selepas').innerHTML = ikon('kanan', 18);
  const tetapanP = muatTetapan();
  const p = new URLSearchParams(location.search);
  $('tarikh').value = /^\d{4}-\d{2}-\d{2}$/.test(p.get('t') || '') ? p.get('t') : hariBekerja(hariIni(), -1);
  const fokus = p.get('sesi');

  // Admin boleh lihat ikut kelas; guru lihat sesi sendiri
  const admin = adalahAdmin(profil);
  if (LIHAT) {
    const jl = await muatJadual();
    pasangJalurLihat(LIHAT, namaCantik(jl.guru[LIHAT]?.nama || LIHAT), 'kerja');
  } else if (admin) {
    const j = await muatJadual();
    const ks = Object.entries(j.kelas).sort((a, b) => a[1].nama.localeCompare(b[1].nama, 'ms', { numeric: true }));
    $('kelas').innerHTML = (profil.guruId ? `<option value="">Sesi saya</option>` : `<option value="">— Pilih kelas —</option>`) +
      ks.map(([id, k]) => `<option value="${id}">${esc(k.nama)}</option>`).join('');
    $('kelas').hidden = false;
    $('kelas').value = p.get('k') || '';
  }

  const masaPendek = (iso) => iso ? new Date(iso).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) : '';
  let data = [];

  async function muat() {
    const t = $('tarikh').value, kelasId = $('kelas').value || '';
    history.replaceState(null, '', `?t=${t}${kelasId ? '&k=' + kelasId : ''}${LIHAT ? '&lihat=' + encodeURIComponent(LIHAT) : ''}`);
    const h = indeksHari(t);
    $('statistik').innerHTML = '';
    if (h < 0) { $('isi').innerHTML = `<div class="kosong"><div class="ikon">🌤️</div><p>Hujung minggu.</p></div>`; return; }
    if (!kelasId && !GID) { $('isi').innerHTML = `<div class="kosong"><p>Pilih kelas.</p></div>`; return; }
    $('isi').innerHTML = `<p class="memuat">Memuatkan…</p>`;

    const [jd, status, hantaran] = await Promise.all([muatJadual(t), statusPdpr(t), hantaranJulat(t, t, kelasId ? null : GID)]);
    data = hantaran;
    const sesi = sesiHari(jd, h, kelasId ? { kelasId } : { guruId: GID }).filter((s) => kelasTerlibat(status, s.kelas));
    if (!status.aktif || !sesi.length) {
      $('isi').innerHTML = `<div class="kosong"><div class="ikon">📭</div><p>${status.aktif ? 'Tiada sesi PDPR untuk dipaparkan.' : 'Bukan hari PDPR.'}</p></div>`;
      return;
    }

    const ikutSesi = {};
    for (const x of hantaran) (ikutSesi[x.sesi] ??= []).push(x);
    const murid = (id) => new Set((ikutSesi[id] || []).map((x) => x.namaMurid.trim().toUpperCase())).size;
    const jumlahMurid = new Set(sesi.flatMap((s) => (ikutSesi[s.id] || []).map((x) => x.kelasId + x.namaMurid.trim().toUpperCase()))).size;
    $('statistik').innerHTML = `
      <div class="stat"><small>Sesi PDPR</small><b>${sesi.length}</b></div>
      <div class="stat"><small>Sesi ada kerja murid</small><b>${sesi.filter((s) => murid(s.id)).length}</b></div>
      <div class="stat"><small>Murid menghantar</small><b>${jumlahMurid}</b></div>
      <div class="stat"><small>Jumlah hantaran</small><b>${sesi.reduce((n, s) => n + (ikutSesi[s.id]?.length || 0), 0)}</b></div>`;

    $('isi').innerHTML = `<div class="senarai-sesi">${sesi.map((s) => {
      const senarai = ikutSesi[s.id] || [];
      const kump = {};
      senarai.forEach((x) => (kump[x.namaMurid.trim().toUpperCase()] ??= []).push(x));
      return `<article class="kad" id="s-${esc(s.id)}" ${s.id === fokus ? 'style="outline:2px solid var(--aksen)"' : ''}>
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
          <h3 style="margin:0">${esc(jd.kelas[s.kelas]?.nama)} · ${esc(jd.subjek[s.subjek]?.nama)}</h3>
          <span class="lencana ${senarai.length ? '' : 'tiada'}">${Object.keys(kump).length} murid</span>
        </div>
        <p class="kecil lembut" style="margin:2px 0 10px">${s.harian ? 'Aktiviti harian' : `${s.mula}–${s.tamat} · ${labelWaktu(s.waktu)}`}</p>
        ${senarai.length ? `<div class="balut-jadual"><table class="jadual-data jadual-kad">
          <thead><tr><th>Murid</th><th>Kerja</th><th>Catatan</th></tr></thead>
          <tbody>${Object.entries(kump).map(([, xs]) => `<tr>
            <td><b>${esc(xs[0].namaMurid)}</b><div class="kecil lembut">${masaPendek(xs[0].masa)}</div></td>
            <td data-label="Kerja">${xs.map((x) => `<span class="kerja-item">${x.jenis === 'pautan'
              ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" class="btn kedua kecil">${ikon('pautan', 14)} Pautan</a>`
              : x.thumb
                ? `<button class="kerja-thumb" data-fail="${esc(x.fileId)}" title="Buka ${esc(x.namaFail)}" aria-label="Buka ${esc(x.namaFail)}"><img src="${x.thumb}" alt=""></button>`
                : `<button class="btn kedua kecil" data-fail="${esc(x.fileId)}" title="${esc(x.namaFail)}">${ikon('fail', 14)} ${esc((x.namaFail || 'Fail').slice(0, 22))}</button>`}<button class="btn bahaya kecil hanya-pemilik" data-padam="${esc(x.id)}" title="Padam (tersalah hantar)" aria-label="Padam ${esc(x.namaFail || 'pautan')} oleh ${esc(x.namaMurid)}">${ikon('sampah', 14)}</button></span>`).join('')}</td>
            <td data-label="Catatan" class="kecil">${esc([...new Set(xs.map((x) => x.catatan).filter(Boolean))].join(' · ') || '—')}</td>
          </tr>`).join('')}</tbody></table></div>`
          : `<p class="belum-teks" style="margin:0">Belum ada kerja dihantar.</p>`}
      </article>`;
    }).join('')}</div>`;
    if (fokus) document.getElementById('s-' + fokus)?.scrollIntoView({ block: 'center' });
  }

  // Buka fail peribadi melalui Apps Script
  $('isi').onclick = async (e) => {
    const p = e.target.closest('[data-padam]');
    if (p) return LIHAT ? undefined : padam(p);
    const b = e.target.closest('[data-fail]');
    if (!b) return;
    const tetingkap = window.open('', '_blank'); // buka segera (elak penyekat pop-up)
    const asal = b.innerHTML;
    b.disabled = true; if (!b.classList.contains('kerja-thumb')) b.textContent = 'Membuka…';
    try {
      const blob = await bukaKerjaMurid(b.dataset.fail, (await tetapanP).appsScriptUrl);
      const url = URL.createObjectURL(blob);
      if (tetingkap) tetingkap.location.href = url; else window.open(url, '_blank');
    } catch (err) {
      tetingkap?.close();
      toast(mesejRalat(err), 'ralat');
    }
    b.disabled = false; b.innerHTML = asal;
  };

  // Padam kerja murid yang tersalah hantar (rekod + fail Drive ke Trash)
  async function padam(b) {
    const x = data.find((y) => y.id === b.dataset.padam);
    if (!x) return;
    if (!confirm(`Padam kerja "${x.namaFail || x.url || 'ini'}" oleh ${x.namaMurid}?\n\nGunakan untuk kerja yang tersalah hantar (salah sesi, salah murid atau fail rosak).`)) return;
    b.disabled = true;
    b.innerHTML = '<i class="pusing"></i>';
    try {
      await buang('hantaran', x.id);
      if (x.fileId) buangFail(x.fileId, (await tetapanP).appsScriptUrl);
      toast('Kerja murid dipadam');
      muat();
    } catch (err) {
      toast(mesejRalat(err), 'ralat');
      b.disabled = false; b.innerHTML = ikon('sampah', 14);
    }
  }

  $('tarikh').onchange = muat;
  $('kelas').onchange = muat;
  $('sebelum').onclick = () => { $('tarikh').value = hariBekerja(tambahHari($('tarikh').value, -1), -1); muat(); };
  $('selepas').onclick = () => { $('tarikh').value = hariBekerja(tambahHari($('tarikh').value, 1), 1); muat(); };
  muat();
</script>
</body>
</html>
