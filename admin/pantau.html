<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantau Guru · Portal PDPR</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0f5c4d">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="PDPR CBA4082">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    // Papar ralat jika skrip halaman gagal (cth fail lama dalam cache), bukannya tersekat pada "Memuatkan…"
    (function () {
      var dah = false;
      function papar(msg) {
        if (dah) return; dah = true;
        var m = document.querySelector('main');
        if (!m || document.querySelector('.app-sisi, .sisi, nav.sidebar')) return;
        m.insertAdjacentHTML('afterbegin', '<div class="notis bahaya" style="margin-top:12px"><b>Halaman gagal dimuatkan.</b> Tekan <b>Ctrl + Shift + R</b> (atau tutup &amp; buka semula aplikasi). <button class="btn kecil" style="margin-left:8px" onclick="location.reload(true)">Muat semula</button><div class="kecil" style="margin-top:6px;opacity:.75">' + String(msg).replace(/[<>&]/g, '') + '</div></div>');
      }
      addEventListener('error', function (e) { if (e.message) papar(e.message); });
      addEventListener('unhandledrejection', function (e) { papar((e.reason && (e.reason.code || e.reason.message)) || e.reason); });
    })();
  </script>
</head>
<body>
<main>
  <div class="kepala">
    <div>
      <h1>Pantau Guru</h1>
      <p class="lembut">Pilih guru untuk melihat jadual, bahan yang dimuat naik dan kerja murid (lihat sahaja).</p>
    </div>
    <div class="nav-hari">
      <button class="btn kedua kecil" id="sebelum" aria-label="Hari sebelum"></button>
      <input type="date" id="tarikh" style="width:auto" aria-label="Tarikh semakan">
      <button class="btn kedua kecil" id="selepas" aria-label="Hari selepas"></button>
      <button class="btn kedua kecil" id="kini">Hari ini</button>
    </div>
  </div>
  <div id="info-hari"></div>

  <div class="statistik" id="statistik"></div>

  <div class="kad" style="padding:14px;margin-bottom:14px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <div class="cari-kelas" style="position:static;padding:0;margin:0;flex:1;min-width:220px">
        <div class="kotak"><span class="ik-cari" id="ik-cari"></span>
          <input type="search" id="cari" placeholder="Cari nama atau kod guru…" autocomplete="off" aria-label="Cari guru" style="height:44px;box-shadow:none"></div>
      </div>
      <div class="tab-segmen" role="tablist" id="penapis">
        <button data-p="semua" aria-selected="true">Semua</button>
        <button data-p="belum">Belum lengkap</button>
        <button data-p="tiada">Belum daftar</button>
      </div>
    </div>
  </div>

  <div id="isi"><p class="memuat">Memuatkan…</p></div>
</main>

<script type="module">
  import { kawal } from '../assets/js/auth.js';
  import { pasangApp, esc, ikon, namaCantik, hariIni, hariBekerja, tambahHari, formatTarikh } from '../assets/js/ui.js';
  import { muatJadual, statusPdpr, kelasTerlibat, bahanTarikh, petaSiapGuru, siapUntuk, modKongsi, muatTetapan, senarai } from '../assets/js/data.js';
  import { sesiHari, indeksHari, labelWaktu } from '../assets/js/jadual.js';
  import { ikonCari } from '../assets/js/cari-kelas.js';

  const sesiAuth = await kawal('admin');
  await pasangApp('admin/pantau.html', sesiAuth);

  const $ = (id) => document.getElementById(id);
  $('sebelum').innerHTML = ikon('kiri', 18);
  $('selepas').innerHTML = ikon('kanan', 18);
  $('ik-cari').innerHTML = ikonCari;

  const kini = hariIni();
  const p = new URLSearchParams(location.search);
  let tarikh = hariBekerja(/^\d{4}-\d{2}-\d{2}$/.test(p.get('t') || '') ? p.get('t') : kini, -1);
  const urlSemasa = () => `?t=${tarikh}${penapis !== 'semua' ? '&p=' + penapis : ''}`;
  let penapis = p.get('p') || 'semua';
  let baris = [];

  // Akaun pengguna & daftar awal (sekali sahaja)
  const [users, jemputan] = await Promise.all([senarai('users').catch(() => []), senarai('jemputan').catch(() => [])]);
  const akaunGuru = {};
  users.filter((x) => x.guruId).forEach((x) => (akaunGuru[x.guruId] ??= []).push(x));
  const jemputGuru = Object.fromEntries(jemputan.filter((j) => j.guruId).map((j) => [j.guruId, j]));

  const jamMasa = (iso) => iso ? new Date(iso).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }) : '';

  async function muat() {
    history.replaceState(null, '', urlSemasa());
    $('tarikh').value = tarikh;
    $('isi').innerHTML = `<p class="memuat">Memuatkan…</p>`;
    const h = indeksHari(tarikh);

    const [status, bahan, jd, tetapan] = await Promise.all([statusPdpr(tarikh), bahanTarikh(tarikh), muatJadual(tarikh), muatTetapan()]);
    const siap = petaSiapGuru(bahan), MOD = modKongsi(tetapan);
    const pdpr = !!status?.aktif;
    $('info-hari').innerHTML = !pdpr
      ? `<div class="notis amaran">${esc(formatTarikh(tarikh))} bukan hari PDPR. Tiada sesi untuk disemak.</div>`
      : `<p class="lembut" style="margin:-6px 0 14px">${esc(formatTarikh(tarikh))}${status.catatan ? ' · ' + esc(status.catatan) : ''}</p>`;

    baris = Object.entries(jd.guru).map(([gid, g]) => {
      const sesi = pdpr && h >= 0 ? sesiHari(jd, h, { guruId: gid }).filter((s) => kelasTerlibat(status, s.kelas)) : [];
      const butiran = sesi.map((s) => {
        const st = siapUntuk(siap, tarikh, s.id, gid, MOD);
        return {
          label: `${jd.kelas[s.kelas]?.nama || s.kelas} · ${jd.subjek[s.subjek]?.ringkas || s.subjek}`,
          waktu: s.harian ? 'Harian' : labelWaktu(s.waktu).replace('Waktu ', 'W'),
          ok: st.siap, sendiri: st.sendiri,
          oleh: !st.sendiri && st.oleh.length ? st.oleh.map((g) => jd.guru[g]?.ringkas || '?').join(', ') : '',
        };
      });
      const diisi = butiran.filter((x) => x.ok).length;
      const milik = bahan.filter((b) => b.olehGuruId === gid || (b.guruId === gid && !b.bagiPihak));
      const terakhir = milik.reduce((m, b) => (b.masa > m ? b.masa : m), '');
      const akaun = akaunGuru[gid] || [];
      const st = akaun.some((a) => a.status === 'lulus') ? 'lulus' : akaun.length ? 'menunggu' : jemputGuru[gid] ? 'didaftar' : 'tiada';
      return { gid, g, jumlah: sesi.length, diisi, butiran, pc: sesi.length ? Math.round((diisi / sesi.length) * 100) : null,
        terakhir, bilBahan: milik.length, st, emel: akaun.map((a) => a.email).join(', ') || jemputGuru[gid]?.id || '' };
    });

    const adaSesi = baris.filter((b) => b.jumlah);
    const lengkap = adaSesi.filter((b) => b.diisi === b.jumlah).length;
    const tiadaAkaun = baris.filter((b) => b.st === 'tiada' || b.st === 'didaftar').length;
    const tot = adaSesi.reduce((n, b) => n + b.jumlah, 0), totIsi = adaSesi.reduce((n, b) => n + b.diisi, 0);
    $('statistik').innerHTML = `
      <div class="stat"><small>Guru bersesi hari ini</small><b>${adaSesi.length}</b></div>
      <div class="stat"><small>Lengkap hari ini</small><b>${lengkap}<span class="lembut" style="font-size:.9rem;font-weight:500"> / ${adaSesi.length}</span></b><div class="bar-maju"><i style="width:${adaSesi.length ? (lengkap / adaSesi.length) * 100 : 0}%"></i></div></div>
      <div class="stat"><small>Sesi diisi</small><b>${totIsi}/${tot}</b><div class="lembut kecil">${tot ? Math.round((totIsi / tot) * 100) : 0}% pematuhan</div></div>
      <div class="stat"><small>Belum log masuk</small><b>${tiadaAkaun}</b></div>`;
    lukis();
  }

  const LABEL_ST = {
    lulus: '<span class="lencana">Aktif</span>',
    menunggu: '<span class="lencana amaran">Menunggu kelulusan</span>',
    didaftar: '<span class="lencana tiada">Didaftar · belum log masuk</span>',
    tiada: '<span class="lencana bahaya">Belum daftar</span>',
  };

  function lukis() {
    const q = $('cari').value.trim().toLowerCase();
    const xs = baris
      .filter((b) => !q || b.g.nama.toLowerCase().includes(q) || (b.g.ringkas || '').toLowerCase() === q || (b.g.ringkas || '').toLowerCase().startsWith(q))
      .filter((b) => penapis === 'semua' || (penapis === 'belum' ? b.jumlah && b.diisi < b.jumlah : b.st === 'tiada' || b.st === 'didaftar'))
      .sort((a, b) => (a.pc ?? 101) - (b.pc ?? 101) || a.g.nama.localeCompare(b.g.nama, 'ms'));

    document.querySelectorAll('#penapis button').forEach((x) => x.setAttribute('aria-selected', x.dataset.p === penapis));
    if (!xs.length) { $('isi').innerHTML = `<div class="kosong"><p>Tiada guru sepadan.</p></div>`; return; }

    $('isi').innerHTML = `<div class="balut-jadual"><table class="jadual-data jadual-kad">
      <thead><tr><th>Guru</th><th>Akaun</th><th>Sesi hari ini</th><th>Upload terakhir</th><th></th></tr></thead>
      <tbody>${xs.map((b) => {
        const warna = b.pc === null ? 'var(--garis)' : b.pc === 100 ? 'var(--utama-2)' : b.pc >= 50 ? 'var(--aksen)' : 'var(--bahaya)';
        return `<tr class="baris-guru" data-g="${esc(b.gid)}">
          <td><b>${esc(namaCantik(b.g.nama))}</b><div class="kecil lembut">${esc(b.g.ringkas || '')}${b.emel ? ' · ' + esc(b.emel) : ''}</div></td>
          <td data-label="Akaun">${LABEL_ST[b.st]}</td>
          <td data-label="Diisi">${b.jumlah
            ? `<div class="peratus"><b>${b.diisi}/${b.jumlah}</b><div class="bar-maju"><i style="width:${b.pc}%;background:${warna}"></i></div></div>
               <div class="cip-sesi">${b.butiran.map((x) => `<span class="sesi-cip ${x.ok ? (x.sendiri ? 'ok' : 'rakan') : 'belum'}" title="${esc(x.waktu)}${x.oleh ? ' · upload oleh ' + esc(x.oleh) : ''}">${x.ok ? '✓' : '○'} ${esc(x.label)} <small>${esc(x.waktu)}${x.oleh ? (x.ok ? ' · oleh ' : ' · sudah oleh ') + esc(x.oleh) : ''}</small></span>`).join('')}</div>`
            : '<span class="lembut kecil">Tiada sesi PDPR</span>'}</td>
          <td data-label="Terakhir" class="kecil">${b.terakhir ? esc(jamMasa(b.terakhir)) + ` <span class="lembut">· ${b.bilBahan} bahan</span>` : '<span class="lembut">—</span>'}</td>
          <td style="text-align:right"><a class="btn kedua kecil" href="../guru/index.html?lihat=${encodeURIComponent(b.gid)}&m=${tarikh}">${ikon('mata', 16)} Lihat</a></td>
        </tr>`;
      }).join('')}</tbody></table></div>
      <p class="bantuan">${xs.length} guru dipaparkan. Klik baris untuk melihat jadual, bahan dan kerja murid guru tersebut.</p>`;
  }

  $('isi').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    const tr = e.target.closest('[data-g]');
    if (tr) location.href = `../guru/index.html?lihat=${encodeURIComponent(tr.dataset.g)}&m=${tarikh}`;
  });
  $('cari').oninput = lukis;
  document.querySelectorAll('#penapis button').forEach((b) => (b.onclick = () => { penapis = b.dataset.p; history.replaceState(null, '', urlSemasa()); lukis(); }));
  $('sebelum').onclick = () => { tarikh = hariBekerja(tambahHari(tarikh, -1), -1); muat(); };
  $('selepas').onclick = () => { tarikh = hariBekerja(tambahHari(tarikh, 1), 1); muat(); };
  $('kini').onclick = () => { tarikh = hariBekerja(kini, -1); muat(); };
  $('tarikh').onchange = (e) => { if (e.target.value) { tarikh = hariBekerja(e.target.value, 1); muat(); } };
  muat();
</script>
</body>
</html>
